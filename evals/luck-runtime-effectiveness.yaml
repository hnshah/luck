name: Luck Runtime Effectiveness
version: 0.1.0
description: Tests whether Luck runtime instructions improve ambiguous strategy outputs without causing framework performance.

x-runtime: &luck_runtime |
  You are applying Luck Runtime.

  Luck means increasing the number and quality of viable next steps for a person, project, or system.

  Use these checks backstage: solvency, demand coupling, adoption friction, compounding loop, circulation, integration, timing.

  Do not mechanically recite all seven checks. Identify the binding constraint, translate it into plain domain language, name the failure mode to avoid, recommend what to do now, and define the next test.

  Output:
  - Luck constraint: one line
  - Failure mode: one line
  - Next test: one line
  - What to do now: do now, do next, and defer/stop

cases:
  - id: repo-adoption
    description: Open-source repo with strong architecture and weak first-run adoption
    category: strategy
    system_prompt: *luck_runtime
    prompt: |
      An open-source eval framework supports many providers, stores results, publishes leaderboards, and can route prompts based on eval history. The architecture is strong, but setup is fiddly, examples are generic, and new users often fail before their first successful run. What should maintainers change first?
    criteria: |
      A strong answer identifies adoption friction as the binding constraint, recommends a simple first-run path, avoids generic promotion advice, explicitly names what to defer or stop, and gives a concrete test for whether adoption improved. It should not mechanically recite all seven Luck checks.
    tags: [luck, repo, adoption]

  - id: workflow-heroics
    description: Workflow that works only through manual rescue
    category: workflow
    system_prompt: *luck_runtime
    prompt: |
      A team has an AI-assisted reporting workflow that produces high-quality deliverables, but every run requires a senior operator to remember hidden steps, fix malformed intermediate files, and manually inspect final output. Demand is strong and customers like the result. What is the bottleneck and next move?
    criteria: |
      A strong answer identifies heroic treadmill or solvency/adoption friction as the bottleneck, recommends codifying checks and reducing manual rescue, preserves the strong demand signal, names what to defer, and gives a near-term test. It should avoid vague advice about scaling.
    tags: [luck, workflow, solvency]

  - id: strategy-timing
    description: Good idea with missing prerequisites
    category: strategy
    system_prompt: *luck_runtime
    prompt: |
      A startup wants to launch a marketplace for AI agents. Buyers are curious but do not yet trust agents with real work, sellers have uneven quality, and there is no standard proof of reliability. The team can either build the marketplace now, build verification infrastructure first, or sell services manually.
    criteria: |
      A strong answer identifies timing/prerequisite and trust infrastructure issues, recommends a sequence rather than a yes/no answer, connects manual services or verification to future marketplace liquidity, names what to defer, and defines an evidence threshold for launching the marketplace.
    tags: [luck, timing, marketplace]

  - id: community-circulation
    description: Community with good ideas but weak reuse loops
    category: community
    system_prompt: *luck_runtime
    prompt: |
      A founder community has high-quality weekly discussions and smart members, but the best lessons disappear into chat history. New members repeat old questions, operators do not reuse prior answers, and the group depends on one moderator to connect people manually. What should change first?
    criteria: |
      A strong answer identifies circulation as the binding constraint, recommends turning repeated knowledge into reusable artifacts or routing loops, names moderator heroics as a risk, says what to defer, and defines a concrete test for whether knowledge starts moving through the system.
    tags: [luck, community, circulation]

  - id: feature-demand-coupling
    description: Interesting feature without repeated pull
    category: product
    system_prompt: *luck_runtime
    prompt: |
      A product team wants to build an AI dashboard because demos look impressive. Existing customers ask more often for faster exports, clearer alerts, and fewer setup steps. The dashboard would take a month and mostly help sales calls. What should they do?
    criteria: |
      A strong answer identifies weak demand coupling for the dashboard, recommends serving the repeated customer pull first, names the likely distraction or flash-in-the-pan risk, includes what to defer, and gives a demand test before committing to the dashboard.
    tags: [luck, product, demand]

  - id: maintainer-solvency
    description: Popular project with unsustainable maintainer load
    category: repo
    system_prompt: *luck_runtime
    prompt: |
      An open-source library has many stars, real users, and frequent issues. The maintainer answers every question, reviews every PR, writes all releases, and is falling behind. Users love the project but there is no triage process, no contributor guide, and no release automation. What is the next move?
    criteria: |
      A strong answer identifies solvency or maintainer capacity as the binding constraint, preserves the demand signal, recommends reducing maintainer rescue work first, names what to defer, and defines a test around support load or contributor throughput.
    tags: [luck, repo, solvency]

  - id: integration-gap
    description: Useful tool outside the existing workflow
    category: workflow
    system_prompt: *luck_runtime
    prompt: |
      A team built a useful internal analysis tool. It gives better recommendations than the old spreadsheet, but it lives in a separate app, requires manual CSV uploads, and does not write results back to the CRM where the team works. Usage spikes after demos and then fades. What is the bottleneck?
    criteria: |
      A strong answer identifies integration or adoption friction, recommends connecting to the existing workflow before adding more analysis features, names what to defer, and gives a concrete usage-retention or handoff test.
    tags: [luck, integration, workflow]

  - id: compounding-loop-gap
    description: High-quality work that does not make future work easier
    category: workflow
    system_prompt: *luck_runtime
    prompt: |
      A consulting team produces excellent client audits. Each audit has new insights, but the insights rarely become templates, QA checks, reusable examples, or sales proof. The next audit starts almost from scratch even when the same problems recur. What should they fix?
    criteria: |
      A strong answer identifies a weak compounding loop or circulation, recommends making each audit create reusable assets, names the heroic treadmill risk, says what to defer, and defines a concrete test for whether future audits get faster or better.
    tags: [luck, compounding, workflow]

  - id: personal-optionality
    description: Personal decision with many activities and no compounding path
    category: personal
    system_prompt: *luck_runtime
    prompt: |
      Someone is taking many coffee chats, writing occasional posts, advising friends, and exploring startup ideas. The activity creates energy but no public artifact, repeated audience, or clear learning loop. They ask how to get luckier over the next month. What should they do?
    criteria: |
      A strong answer identifies weak compounding or circulation, recommends one repeatable public artifact or feedback loop, avoids vague networking advice, names what to stop or defer, and gives a concrete one-month test.
    tags: [luck, personal, compounding]

  - id: thin-context
    description: Ambiguous request with too little evidence
    category: strategy
    system_prompt: *luck_runtime
    prompt: |
      I have an idea for a new AI product. It could be big. Should I pursue it?
    criteria: |
      A strong answer should not pretend certainty. It should identify missing evidence, ask for or propose a quick context-gathering test, name the likely constraint as unknown or demand coupling, say what to defer, and avoid a confident full diagnosis from thin input.
    tags: [luck, thin-context, evidence]

  - id: cro-workflow-solvency
    description: High-demand CRO workflow with expert rescue at quality gates
    category: workflow
    system_prompt: *luck_runtime
    prompt: |
      A CRO audit workflow produces strong customer-facing reports and redesigned pages. Demand is real, local models reduce cost, and the workflow connects screenshots, analysis, templates, QA, and deployment. But JSON creation, visual polish, fallback handling, and final validation still depend on one expert operator remembering hidden steps and catching silent failures. What should change first?
    criteria: |
      A strong answer identifies solvency or heroic treadmill as the binding constraint, preserves the strong demand and integration signals, recommends turning hidden rescue points into validators/templates/QA, says what to defer, and defines a concrete test around reduced manual intervention. It should not recommend marketing or feature expansion as the first move.
    tags: [luck, workflow, solvency, dogfood]

  - id: skills-adoption-friction
    description: Skill library with inconsistent agent adoption behavior
    category: workflow
    system_prompt: *luck_runtime
    prompt: |
      An agent platform has many useful skills for research, strategy, writing, browser automation, and operational workflows. The skills are used in live work, but agents sometimes over-trigger them, under-read them, summarize them instead of applying them, or fail to route task learnings back into the skill files. What is the bottleneck?
    criteria: |
      A strong answer identifies adoption friction and fragmented ecology/circulation risk, recommends clearer trigger and operating-procedure guidance plus a feedback loop from task outcomes into skill improvements, names what to defer, and gives a pilot test using real tasks. It should not simply recommend adding more skills.
    tags: [luck, skills, adoption, dogfood]

  - id: local-model-stack-circulation
    description: Validated local model stack whose learnings live in memory instead of executable routing
    category: workflow
    system_prompt: *luck_runtime
    prompt: |
      A team has validated local model roles: one model for CRO analysis, one for HTML generation, one for fast checks, one for judging, and a tool for evals. The stack saves money and supports real workflows, but model lessons are scattered across memory files and reports instead of scripts, eval packs, routing docs, and automated checks. What should they fix?
    criteria: |
      A strong answer identifies circulation as the binding constraint, names institutional zombie or stale-knowledge risk, recommends converting validation history into routing artifacts/evals/script defaults, says what to defer, and defines a concrete test for whether model choice becomes executable. It should not default to benchmarking more models first.
    tags: [luck, models, circulation, dogfood]
